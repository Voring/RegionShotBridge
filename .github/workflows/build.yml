name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading "v" (e.g. 1.0.0)'
        required: false
        default: ""

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          brew update >/dev/null 2>&1 || true
          brew install ldid xz >/dev/null 2>&1 || brew upgrade ldid xz >/dev/null 2>&1 || true
          command -v ldid
          command -v xz

      - name: Install Theos (roothide fork)
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/vendor/mod/roothide"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          set -e
          "$THEOS/bin/install-sdk" 16.5 || "$THEOS/bin/install-sdk" latest
          ls "$THEOS/sdks"

      - name: Resolve SDK
        id: sdk
        run: |
          set -e
          VER=""
          for v in 16.5 15.6; do
            if [ -d "$THEOS/sdks/iPhoneOS$v.sdk" ]; then
              VER="$v"
              break
            fi
          done
          if [ -z "$VER" ]; then
            SDK_PATH="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk | sort -V | tail -n1)"
            VER="$(basename "$SDK_PATH" .sdk)"
            VER="${VER#iPhoneOS}"
          fi
          echo "Using iOS SDK $VER"
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Apply release version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          set -e
          NEW_VERSION="${{ github.event.inputs.version }}"
          sed -i '' "s/^Version:.*/Version: ${NEW_VERSION}/" control
          grep "^Version:" control

      - name: Build package (roothide)
        run: |
          set -e
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:${{ steps.sdk.outputs.value }}:15.0
          ls -l packages
          echo "===== deb contents ====="
          dpkg-deb -c packages/*.deb || true
          echo "===== deb control ====="
          dpkg-deb -I packages/*.deb || true

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p dist
          cp -v packages/*.deb dist/
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionShotBridge-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish rolling release (latest)
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.version == '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          tag_name: latest
          name: Latest build (main)
          body: ${{ format('Automated roothide build from {0} ({1}).', github.sha, github.event.head_commit.message) }}
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version != '' && format('RegionShotBridge v{0}', github.event.inputs.version) || format('RegionShotBridge {0}', github.ref_name) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
