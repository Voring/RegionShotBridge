name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading "v" (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz >/dev/null 2>&1 || brew upgrade ldid xz >/dev/null 2>&1 || true
          command -v ldid || { echo 'ldid is missing'; exit 1; }

      - name: Fetch Theos (roothide fork)
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Fetch iOS SDKs when the fork ships none
        run: |
          if [ ! -d "$THEOS/sdks" ] || [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
          ls "$THEOS/sdks" | head -20

      - name: Resolve SDK
        id: sdk
        run: |
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo 'value=16.5' >> "$GITHUB_OUTPUT"
          else
            echo 'value=latest' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply release version
        if: ${{ inputs.version != '' }}
        run: sed -i '' "s/^Version: .*/Version: ${{ inputs.version }}/" control

      - name: Build package (roothide)
        run: |
          make clean || true
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            TARGET=iphone:clang:${{ steps.sdk.outputs.value }}:15.0

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -v packages/*.deb dist/
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionShotBridge-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('RegionShotBridge v{0}', inputs.version) || format('RegionShotBridge {0}', github.ref_name) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
